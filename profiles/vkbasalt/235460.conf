# METAL GEAR RISING: REVENGEANCE (235460): vkBasalt post-processing for the 4K TV (3840x2160 at 59.94 Hz)
# Read by the arm64 vkBasalt layer in $SG_DATA/vklayers (Ubuntu 24.04's vkbasalt 0.3.2.10-1, unmodified): with FEX's
# Vulkan thunking the game's Vulkan calls run through the native arm64 loader, so the layer is arm64, like MangoHud
# (docs/FINDINGS.md, "Frame times through FEX"). profiles/launch/235460.env turns it on with ENABLE_VKBASALT=1,
# VKBASALT_CONFIG_FILE=<this file> and CONTAINER_VK_IMPLICIT_LAYER_PATH (pressure-vessel resets the layer paths).
# Format: key = value; "#" starts a comment; spaces are ignored. If this file cannot be read, vkBasalt silently runs
# its defaults (CAS at 0.4); VKBASALT_LOG_FILE=/some/file in the profile logs the file it read and every value.
#
# The game reaches this layer already antialiased (8x MSAA with DXVK's sample-rate shading, i.e. supersampling), so
# there is no FXAA/SMAA pass here: it would only blur. Supersampling averages each pixel's samples (a box filter),
# which leaves the image soft; one light sharpening pass restores it.

# Effects run in this order on every presented frame. CAS alone is one full-screen pass: at 3840x2160 it reads and
# writes a 33 MB image per frame, about 0.3 ms of the 16.7 ms frame on GB10's shared 273 GB/s memory (estimate),
# plus one 33 MB image per swapchain image (about 100 MB). Nothing here needs ReShade shader files.
effects = cas

# Contrast Adaptive Sharpening (AMD FidelityFX CAS). It sharpens most where local contrast is low and backs off at
# hard edges and in highlights, so HUD text and bright outlines do not ring. Scale -1 (gentlest) to 1 (strongest,
# artefacts); vkBasalt's default is 0.4. 0.6 because at 4K a pixel is a quarter of the size seen from the couch, so
# the softness and the sharpening both show less than at 1080p. If edges look etched, step back to 0.4-0.5.
casSharpness = 0.6

# Home turns the effects off and on, to compare. vkBasalt reads the X keyboard state every frame, so any keyboard on
# the TV's display works whatever has focus (MangoHud's hotkey works the same way inside Steam's container). Any X
# key name works (e.g. Scroll_Lock) if the game needs Home. Effects start on.
toggleKey = Home
enableOnLaunch = True

# Deband is not enabled. Add it before the sharpening ("effects = deband:cas"; CAS would make banding steps stand out)
# only if skies or fog show steps: it costs a second full-screen pass. vkBasalt's port keeps only its last
# iteration, which multiplies the radius and thresholds: the default 4 iterations smooth away differences up to
# 13.6/255, enough to flatten fine texture. One iteration with a 32 px radius at 4K (16 px at 1080p) only touches
# near-flat gradients (differences under 3.4/255). These two lines do nothing while deband is not in effects.
debandIterations = 1
debandRange = 32
