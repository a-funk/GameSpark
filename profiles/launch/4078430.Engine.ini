; Written into the Wine prefix by tools/launch.sh before every launch; the game deletes Saved/Config/Windows/Engine.ini
; after reading it at startup. Why each line is here: docs/FINDINGS.md, "Galactic Racer: flash frames".
[SystemSettings]
; Nanite on since 2026-10-19 (kernel 7.0 + NVIDIA 615.71.09). On the R580 driver Nanite left the player's vehicle undrawn
; in ~28% of frames; on R615 it is drawn in 97-98% of them, as with Nanite off. Nanite is also faster (R580: 44-72 fps
; off vs 69-83 on, R615: 78-91 on) and Crait's salt flat is white only with it. Back on R580, set r.Nanite=0 (it needs
; VKD3D_CONFIG=nodxr in 4078430.env, or the campaign's Jakku maps crash on load).
r.Nanite=1
; The game's own lighting without ray tracing, its Global Illumination Low tier: baked lighting for each map and time of
; day. This game runs Lumen only on hardware ray tracing (no distance fields), so with DXR hidden there is otherwise no
; indirect light at all and caves and shade are as bright as open sand. The skylight scale is the tier's own value.
gfn.StaticLighting.UseVolumetricLightingIfAvailable=1
r.SkylightIntensityMultiplier=0.8
; Hardware occlusion queries made background objects flicker in the menu.
r.AllowOcclusionQueries=0
